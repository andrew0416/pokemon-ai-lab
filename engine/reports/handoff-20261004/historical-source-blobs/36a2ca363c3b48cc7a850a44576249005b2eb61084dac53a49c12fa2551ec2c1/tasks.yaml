# lab-engine 진행 보드 (prog, 중앙 모드). 편집은 사용자 위임으로 Fable 세션이 한다(2026-09-26).
# 영구 기록(커밋 해시·fixture·병합 해소)은 engine/WORKPLAN.md §4, 여기는 살아 있는 상태만.
# 규칙(2026-09-27 사용자 지적): 모든 todo는 발견 즉시 여기에 올리고 depends_on을 적는다. 에이전트 보고의 '범위 밖'·'미확인'·'한계'도 빠짐없이.
# 연구(탐색·평가·전략 비교) 작업은 M1-engine-complete에 의존한다(사용자 우선순위: 엔진 완결이 먼저).
# 2026-09-27 사용자 지시: 진행 중인 작업이 끝나면 새 웨이브를 띄우지 말고 PLAN1(교통정리)부터 한다.
# touches 충돌 회피는 끈다: volatile.rs·battle.rs처럼 모든 단위가 건드리는 파일이 있어
# 켜면 병렬성이 사라진다. 병합 충돌은 병합하는 세션(Fable)이 해소한다.
policy:
  claim_ttl: 45m
  max_escalation: 1
  session_gap: 30m
  estimates: manual
  touch_conflicts: false
  min_samples: 3
bars:
  - {name: all, filter: "*"}
  - {name: engine, filter: engine}
  - {name: bugs, filter: bugs}
  - {name: coverage, filter: coverage}
  - {name: search, filter: search}
  - {name: verify, filter: verify}
  - {name: docs, filter: docs}
  - {name: refusal, filter: refusal}
  - {name: perf, filter: perf}
  - {name: py, filter: py}
