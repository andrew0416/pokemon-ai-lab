[package]
name = "lab-engine-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lab_engine"
crate-type = ["cdylib"]

[dependencies]
lab-engine = { path = "../core" }
lab-scenario = { path = "../scenario" }
# `node` (the Python API's core) only; the CLI binaries are not needed.
lab-search = { path = "../search", default-features = false, features = ["scenario"] }
serde_json = "1"
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }
