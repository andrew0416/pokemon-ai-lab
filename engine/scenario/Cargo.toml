[package]
autotests = false
name = "lab-scenario"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loads oracle scenario/team JSON into lab-engine states (off the search hot path)."

[lib]
name = "lab_scenario"
path = "src/lib.rs"

# serde lives here, not in lab-engine: the search crate stays dependency-free.
[dependencies]
lab-engine = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `lab-check` reads the parity corpus's gzipped scenarios and reports directly (board P5).
flate2 = "1"

[[bench]]
name = "turn"
harness = false

# Experiment: preserve tests while reducing integration-test executable count.

[[test]]
name = "bundle_scenario_01"
path = "tests/bundle_scenario_01.rs"

[[test]]
name = "bundle_scenario_02"
path = "tests/bundle_scenario_02.rs"

[[test]]
name = "bundle_scenario_03"
path = "tests/bundle_scenario_03.rs"

[[test]]
name = "bundle_scenario_04"
path = "tests/bundle_scenario_04.rs"

[[test]]
name = "bundle_scenario_05"
path = "tests/bundle_scenario_05.rs"

[[test]]
name = "bundle_scenario_06"
path = "tests/bundle_scenario_06.rs"

[[test]]
name = "ae_lab_check_timeout"
path = "tests/ae_lab_check_timeout.rs"

[[test]]
name = "factored"
path = "tests/factored.rs"

[[test]]
name = "lab_check_batch"
path = "tests/lab_check_batch.rs"

[[test]]
name = "yy_position_hash"
path = "tests/yy_position_hash.rs"

[features]
experiment-replay-action-keys-observer = ["lab-engine/experiment-replay-action-keys-observer"]
experiment-slot-diff-observer = ["lab-engine/experiment-slot-diff-observer"]
experiment-volatile-hash-update-observer = ["lab-engine/experiment-volatile-hash-update-observer"]

[[test]]
name = "replay_action_keys"
path = "tests/replay_action_keys.rs"
required-features = ["experiment-replay-action-keys-observer"]

[[test]]
name = "p8e_slot_diff"
path = "tests/p8e_slot_diff.rs"
required-features = ["experiment-slot-diff-observer"]

[[test]]
name = "volatile_hash_update"
path = "tests/volatile_hash_update.rs"
