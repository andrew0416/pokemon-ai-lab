[package]
name = "lab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Slot-generic Pokémon battle engine for search (N = 1 singles, N = 2 doubles)."

[lib]
name = "lab_engine"
path = "src/lib.rs"

[dependencies]
smallvec = { version = "1.13", features = ["const_generics"] }

[[bench]]
name = "damage"
harness = false

[features]
experiment-hurt-readers = []
experiment-prepared-turn = []
experiment-prepared-turn-observe = ["experiment-prepared-turn"]
