[package]
name = "lab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Slot-generic Pokémon battle engine for search (N = 1 singles, N = 2 doubles)."

[lib]
name = "lab_engine"
path = "src/lib.rs"

[dependencies]
smallvec = { version = "1.13", features = ["const_generics"] }

[[bench]]
name = "damage"
harness = false

[features]
experiment-hurt-readers = []
experiment-prepared-turn = []
experiment-prepared-turn-observe = ["experiment-prepared-turn"]
# P9 isolated experiment. Neither feature is enabled by default.
experiment-leaf-ending-states = []
experiment-leaf-ending-observer = ["experiment-leaf-ending-states"]
# P10: opt-in sparse storage; dense Volatiles remains the default representation.
experiment-compact-volatiles = []

# Independent P8d/e/f experiments; every runtime and observer feature is opt-in.
experiment-replay-action-keys = []
experiment-replay-action-keys-observer = ["experiment-replay-action-keys"]
experiment-slot-diff = []
experiment-slot-diff-observer = ["experiment-slot-diff"]
experiment-stats-off-cost = []
experiment-stats-off-cost-observer = ["experiment-stats-off-cost"]
# P13: borrowed position lookup only; no state identity or storage changes.
experiment-borrowed-child-keys = []
# P1e: collapse universally fainted HP only while dealt damage remains unobserved.
experiment-lazy-ko-damage = []

# P7d: exact Full factored first-hit stage; no default, sampler, or SIMD changes.
experiment-factored-first-hit = []

# P7h: intra-group suffix retention, never a new public suspension.
experiment-factored-hit-suffix = ["experiment-factored-first-hit"]
