name: P7d factored first-hit pilot
run-name: "P7d exact joint pilot and paired Full API timings"
on:
  push:
    branches: [codex/p7d-factored-first-hit-20261002]
permissions:
  contents: read
concurrency:
  group: engine-p7d-factored-first-hit
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-Ctarget-cpu=x86-64"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RAYON_NUM_THREADS: "1"
  RUST_MIN_STACK: "16777216"
  RUST_TEST_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Frozen controller and B17 corpus
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Frozen candidate source shared by OFF and ON
        uses: actions/checkout@v4
        with:
          ref: 8f7bdb4742cec83aac8bf8891e6c5db90142cf34
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Immutable P1e reference source563
        uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Python producer and gate regressions
        run: python -B -m unittest discover -s controller/engine/benchmarks/p7d_first_hit -p 'test_*.py' -v
      - name: Verify immutable sources and pilot plans
        run: python -B controller/engine/benchmarks/p7d_first_hit/pilot_run.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Restore dependency compilation only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-p7d-first-hit-deps-v1
          workspaces: |
            reference/engine -> ../../target-p7d-reference
            source/engine -> ../../target-p7d-off
            source/engine -> ../../target-p7d-on
            source/engine -> ../../target-p7d-edge
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: true
      - name: Fresh core and frozen producer tests with actual feature proof
        run: python -B controller/engine/benchmarks/p7d_first_hit/pilot_run.py build --workspace "$GITHUB_WORKSPACE"
      - name: Eight-case three-arm full State and Suspension joint differential
        run: python -B controller/engine/benchmarks/p7d_first_hit/pilot_run.py correctness --workspace "$GITHUB_WORKSPACE"
      - name: Five-case three ABBA Full API timing blocks
        run: python -B controller/engine/benchmarks/p7d_first_hit/pilot_run.py timings --workspace "$GITHUB_WORKSPACE"
      - name: Preserve raw evidence including incomplete runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p7d-first-hit-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7d-first-hit-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
