name: P1e5 full500 candidate distribution
run-name: "P1e5 all500 on one frozen P1e candidate"
on:
  push:
    branches: [codex/p1e5-full500-20261001]
permissions:
  contents: read
concurrency:
  group: engine-p1e5-full500
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-Ctarget-cpu=x86-64"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RAYON_NUM_THREADS: "1"
  RUST_MIN_STACK: "16777216"
  RUST_TEST_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  full500:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Frozen controller and corpus
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Frozen candidate benchmark source
        uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Synthetic controller regression tests
        run: python -m unittest discover -s controller/engine/benchmarks/p1e5_full500 -p 'test_*.py' -v
      - name: Verify fixed source corpus original plans and prior correctness gate
        run: python controller/engine/benchmarks/p1e5_full500/full500.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Restore dependency compilation only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-p1e5-full500-deps-v1
          workspaces: |
            source/engine -> ../../target-p1e5-on
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: false
      - name: Fresh seven benchmark tests and actual candidate feature proof
        run: python controller/engine/benchmarks/p1e5_full500/full500.py build --workspace "$GITHUB_WORKSPACE"
      - name: Same-source all500 fixed case measurements
        run: python controller/engine/benchmarks/p1e5_full500/full500.py run --workspace "$GITHUB_WORKSPACE"
      - name: Preserve all successful and failed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p1e5-full500-${{ github.run_id }}-${{ github.run_attempt }}
          path: p1e5-full500-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
