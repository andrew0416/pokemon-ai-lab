name: P17 factored frontier diagnosis
run-name: "P17 frontier observer / diagnosis only"
on:
  push:
    branches: [codex/p17-frontier-diagnostic-20261001]
permissions:
  contents: read
concurrency:
  group: engine-p17-frontier-diagnostic
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-Ctarget-cpu=x86-64"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RAYON_NUM_THREADS: "1"
  RUST_MIN_STACK: "16777216"
  RUST_TEST_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  p17_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Frozen controller and corpus
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Frozen R1 benchmark source
        uses: actions/checkout@v4
        with:
          ref: 14f600e563c58caf4f17a4e4282348250d673cc6
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test measurement controller
        run: python -m unittest discover -s controller/engine/benchmarks/frontier_diagnostic -p 'test_*.py' -v
      - name: Verify exact source and corpus
        run: python controller/engine/benchmarks/frontier_diagnostic/ci.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Restore dependency compilation only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-p17-frontier-deps-v1
          workspaces: |
            source/engine -> ../../target-p17-off
            source/engine -> ../../target-p17-on
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: false
      - name: Fresh benchmark correctness tests and exact compiled feature proof
        run: python controller/engine/benchmarks/frontier_diagnostic/ci.py build --workspace "$GITHUB_WORKSPACE"
      - name: Verify bounded observer equivalence then diagnose frozen opening0429
        run: python controller/engine/benchmarks/frontier_diagnostic/run.py --workspace "$GITHUB_WORKSPACE"
      - name: Preserve successful and failed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p17-frontier-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: p17-diagnostic-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
