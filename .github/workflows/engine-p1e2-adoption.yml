name: P1e2 adoption validation
run-name: "P1e2 expanded correctness and bounded exact-reference validation"
on:
  push:
    branches: [codex/p1e2-adoption-validation-20261001]
permissions:
  contents: read
concurrency:
  group: engine-p1e2-adoption-validation
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-Ctarget-cpu=x86-64"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RAYON_NUM_THREADS: "1"
  RUST_MIN_STACK: "16777216"
  RUST_TEST_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Frozen controller and corpus
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Frozen candidate source
        uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Original unmodified engine benchmark source
        uses: actions/checkout@v4
        with:
          ref: a4a881420ca35335c6e0ac4c73fd9e686dd617c0
          path: original
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test comparison controller
        run: python -m unittest discover -s controller/engine/benchmarks/p1e2_adoption -p 'test_*.py' -v
      - name: Verify exact source and frozen corpus
        run: python controller/engine/benchmarks/p1e2_adoption/adoption.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Restore dependency compilation only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-p1e2-adoption-deps-v1
          workspaces: |
            original/engine -> ../../target-p1e2-original
            source/engine -> ../../target-p1e2-off
            source/engine -> ../../target-p1e2-on
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: false
      - name: Fresh original, candidate OFF and ON correctness with compiled feature proof
        run: python controller/engine/benchmarks/p1e2_adoption/adoption.py build --workspace "$GITHUB_WORKSPACE"
      - name: Bounded expanded corpus then three-arm full-State agreement
        run: python controller/engine/benchmarks/p1e2_adoption/adoption.py run --workspace "$GITHUB_WORKSPACE"
      - name: Preserve successful and failed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p1e2-accuracy-${{ github.run_id }}-${{ github.run_attempt }}
          path: p1e2-accuracy-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
  exact_reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Frozen controller and corpus
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Frozen candidate source
        uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Original unmodified engine benchmark source
        uses: actions/checkout@v4
        with:
          ref: a4a881420ca35335c6e0ac4c73fd9e686dd617c0
          path: original
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test comparison controller
        run: python -m unittest discover -s controller/engine/benchmarks/p1e2_adoption -p 'test_*.py' -v
      - name: Verify exact source and frozen corpus
        run: python controller/engine/benchmarks/p1e2_adoption/tail.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Restore dependency compilation only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-p1e2-tail-deps-v1
          workspaces: |
            original/engine -> ../../target-p1e2-tail-original
            source/engine -> ../../target-p1e2-tail-on
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: false
      - name: Fresh exporter tests and builds with compiled feature proof
        run: python controller/engine/benchmarks/p1e2_adoption/tail.py build --workspace "$GITHUB_WORKSPACE"
      - name: Original 1200s then ON 300s bounded exact joint-State reference
        run: python controller/engine/benchmarks/p1e2_adoption/tail.py run --workspace "$GITHUB_WORKSPACE"
      - name: Preserve successful and failed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p1e2-exact-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: p1e2-tail-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
