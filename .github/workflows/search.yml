# 탐색을 GitHub Actions에서 돌린다 (사용자 지시 2026-09-27: 로컬 CPU가 느림).
# 입력 디렉터리 engine/jobs/<job>/ 의 *-vs-*.json 시나리오 하나가 러너 하나(4 vCPU)다.
# 무료 러너 한도: 잡당 6시간, 동시 20잡(공개 저장소는 분 제한 없음, 비공개는 월 2,000분).
# 결과는 아티팩트 plan-<scenario>와 병합본 summary-<job>; 로컬 반영은
#   python engine/scripts/actions_job.py unpack <내려받은 디렉터리/zip> runs/actions-<job>
name: search

on:
  workflow_dispatch:
    inputs:
      job:
        description: "engine/jobs/ 아래 디렉터리 이름 (actions_job.py pack 으로 만든 것)"
        required: true
        default: "plan-20260926"
      solve:
        description: "lab-plan --solve (nash | deep | deep-nash | maximin)"
        default: "nash"
      rolls:
        description: "lab-plan --rolls (median | extremes | pessimistic)"
        default: "median"
      side:
        description: "우리 편"
        default: "p1"
      leads:
        description: "plan_sweep --leads (fixed | all)"
        default: "fixed"
      extra:
        description: "lab-plan 추가 인자 한 줄 (예: --beam 4 --outcomes 4 --threads 4)"
        default: ""
      only:
        description: "시나리오 파일 이름 부분 문자열 필터 (비우면 전부)"
        default: ""
      timeout_minutes:
        description: "러너 하나의 상한(분, 최대 360)"
        default: "300"

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib, os
          job = "${{ inputs.job }}"; only = "${{ inputs.only }}"
          files = sorted(p.name for p in pathlib.Path("engine/jobs", job).glob("*-vs-*.json") if only in p.name)
          assert files, f"no *-vs-*.json in engine/jobs/{job}"
          print("scenarios=" + json.dumps(files))
          EOF

  plan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        scenario: ${{ fromJSON(needs.prepare.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          shared-key: search-release
      - name: build lab-plan (release)
        working-directory: engine
        run: cargo build --release -p lab-search --bin lab-plan
      - name: engine commit and CPU
        run: |
          git rev-parse HEAD
          nproc; lscpu | grep -i "model name" || true
      - name: run
        run: |
          python3 engine/scripts/plan_sweep.py "engine/jobs/${{ inputs.job }}" \
            --exe engine/target/release/lab-plan \
            --solve "${{ inputs.solve }}" --rolls "${{ inputs.rolls }}" --side "${{ inputs.side }}" \
            --leads "${{ inputs.leads }}" --only "${{ matrix.scenario }}" \
            --timeout $(( ${{ fromJSON(inputs.timeout_minutes) }} * 60 - 600 )) \
            --extra "${{ inputs.extra }}"
      - name: record provenance
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, platform
          job = "engine/jobs/${{ inputs.job }}"
          meta = {
            "commit": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
            "scenario": "${{ matrix.scenario }}",
            "solve": "${{ inputs.solve }}", "rolls": "${{ inputs.rolls }}", "side": "${{ inputs.side }}",
            "leads": "${{ inputs.leads }}", "extra": "${{ inputs.extra }}",
            "runner": platform.platform(), "cpus": os.cpu_count(),
            "run_id": "${{ github.run_id }}", "run_attempt": "${{ github.run_attempt }}",
          }
          os.makedirs(f"{job}/out", exist_ok=True)
          json.dump(meta, open(f"{job}/out/provenance.${{ matrix.scenario }}.json","w"), indent=1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.scenario }}
          path: |
            engine/jobs/${{ inputs.job }}/out/**
            engine/jobs/${{ inputs.job }}/leads/**
            engine/jobs/${{ inputs.job }}/summary.*.json
          if-no-files-found: error

  collect:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: plan-*
          path: artifacts
      - name: merge summaries
        run: python3 engine/scripts/actions_job.py merge artifacts merged
      - uses: actions/upload-artifact@v4
        with:
          name: summary-${{ inputs.job }}-${{ inputs.solve }}-${{ inputs.rolls }}
          path: merged
