name: P1e4 exact concrete oracle
run-name: "P1e4 bounded original concrete oracle versus lazy candidate"
on:
  push:
    branches: [codex/p1e4-exact-oracle-20261001]
permissions:
  contents: read
concurrency:
  group: engine-p1e4-exact-oracle
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-Ctarget-cpu=x86-64"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RAYON_NUM_THREADS: "1"
  RUST_MIN_STACK: "16777216"
  RUST_TEST_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  exact_reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Frozen controller and corpus
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Frozen candidate source
        uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Frozen original additive concrete oracle source
        uses: actions/checkout@v4
        with:
          ref: 453eabbd89c7ae18addbdbe4669935a7bfaccddc
          path: oracle
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test comparison controller
        run: python -m unittest discover -s controller/engine/benchmarks/p1e4_oracle -p 'test_*.py' -v
      - name: Verify exact source and frozen corpus
        run: python controller/engine/benchmarks/p1e4_oracle/oracle_ci.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Restore dependency compilation only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-p1e4-oracle-deps-v1
          workspaces: |
            oracle/engine -> ../../target-p1e4-oracle
            source/engine -> ../../target-p1e4-candidate
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: false
      - name: Fresh oracle 11 and candidate exporter 6 tests with compiled feature proof
        run: python controller/engine/benchmarks/p1e4_oracle/oracle_ci.py build --workspace "$GITHUB_WORKSPACE"
      - name: Concrete oracle 1200s then candidate 300s exact joint-State reference
        run: python controller/engine/benchmarks/p1e4_oracle/oracle_ci.py run --workspace "$GITHUB_WORKSPACE"
      - name: Preserve successful and failed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p1e4-exact-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: p1e4-oracle-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
