name: engine P8d versus P8d P8e P8f
run-name: "engine speed · old4 + D vs old4 + D E F · ${{ inputs.threads }}t · ${{ inputs.pairs }} pairs"

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "coaching·sand 깊이 2 속도 비교"
        type: choice
        options: [narrow]
        default: narrow
      threads:
        description: "각 A/B 쌍의 동일 스레드 수"
        type: choice
        options: ["1"]
        default: "1"
      pairs:
        description: "국면별 warmup 제외 AB/BA 쌍 수"
        type: choice
        options: ["10"]
        default: "10"
      build_cache:
        description: "검증된 빌드·의존성 캐시 복원; 시간 측정은 항상 새 실행"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: engine-benchmark
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-Ctarget-cpu=x86-64"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  LAB_ENGINE_FACTORED: "0"
  RUST_TEST_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  BUILD_CACHE_ENABLED: ${{ inputs.build_cache && '1' || '0' }}
  BUILD_CACHE_ALLOW_SAVE: ${{ inputs.build_cache && github.event_name == 'workflow_dispatch' && github.repository == 'andrew0416/pokemon-ai-lab' && github.ref == 'refs/heads/lab-engine' && '1' || '0' }}
  BUILD_CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  agreement_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact prior accuracy gate
        run: python -m unittest discover -s engine/benchmarks/p8d_vs_p8def -p 'test_*.py' -v
      - name: Verify prior runs, artifacts and unchanged source contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python engine/benchmarks/p8d_vs_p8def/prior_agreement.py --remote
      - name: Download immutable D accuracy summary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36681590730
          name: agreement-summary
          path: prior-agreement/d
      - name: Download immutable DEF accuracy summary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36698588329
          name: agreement-summary
          path: prior-agreement/def
      - name: Verify both pinned 6184-case summaries and shared baseline contract
        run: >-
          python engine/benchmarks/p8d_vs_p8def/prior_agreement.py --summaries
          prior-agreement/d/agreement-summary.json
          prior-agreement/def/agreement-summary.json
      - name: Preserve exact prior accuracy receipt and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prior-agreement-receipt
          path: |
            prior-agreement/
            prior-agreement-receipt.json
            prior-agreement-remote.json
          if-no-files-found: error
          retention-days: 30

  paired:
    needs: agreement_evidence
    name: speed ${{ matrix.id }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: p8d-vs-p8def
            feature: p8d-vs-p8def
            source_sha: 048e4748e8854dac5eb511a358cc2f8c38c9dc29
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout benchmark controller and shared fixtures
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate request and resolve immutable commits
        id: refs
        env:
          BASELINE_SHA: ${{ matrix.source_sha }}
          CANDIDATE_SHA: ${{ matrix.source_sha }}
          CANDIDATE_FEATURE: ${{ matrix.feature }}
          SUITE: ${{ inputs.suite }}
          THREADS: ${{ inputs.threads }}
          PAIRS: ${{ inputs.pairs }}
        run: python controller/engine/benchmarks/paired/ci.py refs --workspace "$GITHUB_WORKSPACE"
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.baseline_sha }}
          path: baseline
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Install fixed Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Test benchmark controller
        run: python -m unittest discover -s controller/engine/benchmarks/paired -p "test_*.py" -v
      - name: Record provenance and inject identical harness
        run: python controller/engine/benchmarks/paired/ci.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Compute exact verified-build cache identities
        id: cache-plan
        if: inputs.build_cache
        continue-on-error: true
        run: python controller/engine/benchmarks/paired/build_cache.py plan --workspace "$GITHUB_WORKSPACE"
      - name: Restore verified baseline build bundle
        id: cache-baseline
        if: inputs.build_cache && steps.cache-plan.outputs.baseline_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: verified-build-cache/baseline
          key: ${{ steps.cache-plan.outputs.baseline_key }}
          enableCrossOsArchive: false
      - name: Restore verified candidate build bundle
        id: cache-candidate
        if: inputs.build_cache && steps.cache-plan.outputs.candidate_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: verified-build-cache/candidate
          key: ${{ steps.cache-plan.outputs.candidate_key }}
          enableCrossOsArchive: false
      - name: Restore baseline dependency compilation cache
        id: deps-baseline
        if: inputs.build_cache && steps.cache-baseline.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-dependencies-v1
          key: baseline-${{ matrix.feature }}-${{ inputs.suite }}
          workspaces: baseline/engine -> ../../target-baseline
          env-vars: ImageOS ImageVersion
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'andrew0416/pokemon-ai-lab' && github.ref == 'refs/heads/lab-engine' }}
      - name: Restore candidate dependency compilation cache
        id: deps-candidate
        if: inputs.build_cache && steps.cache-candidate.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-dependencies-v1
          key: candidate-${{ matrix.feature }}-${{ inputs.suite }}
          workspaces: candidate/engine -> ../../target-candidate
          env-vars: ImageOS ImageVersion
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'andrew0416/pokemon-ai-lab' && github.ref == 'refs/heads/lab-engine' }}
      - name: Verify source inputs after dependency cache setup
        run: python controller/engine/benchmarks/paired/ci.py verify-prepared --workspace "$GITHUB_WORKSPACE"
      - name: Test and build both versions before timing
        id: build
        env:
          BASELINE_CACHE_HIT: ${{ steps.cache-baseline.outputs.cache-hit }}
          BASELINE_CACHE_MATCHED_KEY: ${{ steps.cache-baseline.outputs.cache-matched-key }}
          CANDIDATE_CACHE_HIT: ${{ steps.cache-candidate.outputs.cache-hit }}
          CANDIDATE_CACHE_MATCHED_KEY: ${{ steps.cache-candidate.outputs.cache-matched-key }}
          BASELINE_DEPENDENCY_CACHE_READY: ${{ steps.deps-baseline.outcome == 'success' && '1' || '0' }}
          BASELINE_DEPENDENCY_CACHE_HIT: ${{ steps.deps-baseline.outputs.cache-hit }}
          CANDIDATE_DEPENDENCY_CACHE_READY: ${{ steps.deps-candidate.outcome == 'success' && '1' || '0' }}
          CANDIDATE_DEPENDENCY_CACHE_HIT: ${{ steps.deps-candidate.outputs.cache-hit }}
        run: python controller/engine/benchmarks/paired/ci.py build --workspace "$GITHUB_WORKSPACE"
      - name: Validate compact Volatiles baseline, enabled and disabled contracts
        if: success() && (matrix.feature == 'compact-volatiles' || contains(fromJSON('["all-optimizations","replay-action-keys","slot-diff","stats-off-cost","p8def-combined","p8d-vs-p8def"]'), matrix.feature))
        run: >-
          python controller/engine/benchmarks/paired/compact_probe.py
          --workspace "$GITHUB_WORKSPACE"
          --out-dir "$GITHUB_WORKSPACE/ci-results/compact-validation"
      - name: Save sealed baseline build bundle
        if: >-
          success() && inputs.build_cache &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'andrew0416/pokemon-ai-lab' &&
          github.ref == 'refs/heads/lab-engine' &&
          steps.cache-baseline.outputs.cache-hit != 'true' &&
          steps.build.outputs.baseline_cache_sealed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: verified-build-cache/baseline
          key: ${{ steps.cache-plan.outputs.baseline_key }}
          enableCrossOsArchive: false
      - name: Save sealed candidate build bundle
        if: >-
          success() && inputs.build_cache &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'andrew0416/pokemon-ai-lab' &&
          github.ref == 'refs/heads/lab-engine' &&
          steps.cache-candidate.outputs.cache-hit != 'true' &&
          steps.build.outputs.candidate_cache_sealed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: verified-build-cache/candidate
          key: ${{ steps.cache-plan.outputs.candidate_key }}
          enableCrossOsArchive: false
      - name: Warm up and measure alternating pairs
        env:
          SUITE: ${{ inputs.suite }}
          THREADS: ${{ inputs.threads }}
          PAIRS: ${{ inputs.pairs }}
        run: >-
          python controller/engine/benchmarks/paired/run.py
          --baseline-exe "$GITHUB_WORKSPACE/target-baseline/release/examples/ci_bench"
          --candidate-exe "$GITHUB_WORKSPACE/target-candidate/release/examples/ci_bench"
          --suite "$SUITE" --threads "$THREADS" --pairs "$PAIRS"
          --timeout 600 --out-dir "$GITHUB_WORKSPACE/ci-results/benchmark"
      - name: Publish summary
        if: always()
        run: |
          if [ -f ci-results/benchmark/summary.md ]; then
            cat ci-results/benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark did not complete. Inspect the job logs and engine-benchmark artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Measure peak RSS separately
        if: success() && (matrix.feature == 'prepared-turn' || matrix.feature == 'compact-volatiles' || contains(fromJSON('["all-optimizations","replay-action-keys","slot-diff","stats-off-cost","p8def-combined","p8d-vs-p8def"]'), matrix.feature))
        env:
          SUITE: ${{ inputs.suite }}
          THREADS: ${{ inputs.threads }}
        run: >-
          python controller/engine/benchmarks/paired/memory.py
          --baseline-exe "$GITHUB_WORKSPACE/target-baseline/release/examples/ci_bench"
          --candidate-exe "$GITHUB_WORKSPACE/target-candidate/release/examples/ci_bench"
          --suite "$SUITE" --threads "$THREADS" --timeout 600
          --benchmark-dir "$GITHUB_WORKSPACE/ci-results/benchmark"
          --out-dir "$GITHUB_WORKSPACE/ci-results/memory"
      - name: Publish peak RSS summary
        if: always() && (matrix.feature == 'prepared-turn' || matrix.feature == 'compact-volatiles' || contains(fromJSON('["all-optimizations","replay-action-keys","slot-diff","stats-off-cost","p8def-combined","p8d-vs-p8def"]'), matrix.feature))
        run: |
          if [ -f ci-results/memory/summary.md ]; then
            cat ci-results/memory/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Peak RSS pass did not complete; timing results alone do not establish memory impact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve logs and raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-speed-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
