name: P7f expanded first-hit correctness
run-name: "P7f frozen full500 plus separate broad104 accuracy"
on:
  push:
    branches: [codex/p7f-first-hit-coverage-20261002]
permissions:
  contents: read
concurrency:
  group: engine-p7f-first-hit-coverage
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-Ctarget-cpu=x86-64"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RAYON_NUM_THREADS: "1"
  RUST_MIN_STACK: "16777216"
  RUST_TEST_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      package_sha256: ${{ steps.build.outputs.package_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 87e7fdcb47b24e407e81d9d5688714dfee6de35d
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Pure Python protocol and failure regressions
        run: python -B -m unittest discover -s controller/engine/benchmarks/p7f_coverage -p 'test_*.py' -v
      - name: Restore and save dependency compilation only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: engine-p7d-first-hit-deps-v1
          workspaces: |
            reference/engine -> ../../target-p7f-reference
            source/engine -> ../../target-p7f-off
            source/engine -> ../../target-p7f-on
            source/engine -> ../../target-p7f-edge
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: true
      - name: Fresh named gates and one immutable binary package
        id: build
        run: python -B controller/engine/benchmarks/p7f_coverage/coverage_run.py build --workspace "$GITHUB_WORKSPACE"
      - name: Preserve build binaries and raw proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p7f-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7f-build/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
  full500:
    name: full500-${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 87e7fdcb47b24e407e81d9d5688714dfee6de35d
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: engine-p7f-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7f-build
      - name: Every frozen Full decision in this disjoint shard
        env:
          PACKAGE_SHA: ${{ needs.build.outputs.package_sha256 }}
          SHARD: ${{ matrix.shard }}
        run: python -B controller/engine/benchmarks/p7f_coverage/coverage_run.py full500 --workspace "$GITHUB_WORKSPACE" --shard "$SHARD" --package-sha "$PACKAGE_SHA"
      - name: Preserve complete and incomplete joint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p7f-accuracy-full500-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7f-full500-${{ matrix.shard }}-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
  broad:
    name: broad104
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 87e7fdcb47b24e407e81d9d5688714dfee6de35d
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 56376838ffea91169321895f8e81abec2137dd46
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: engine-p7f-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7f-build
      - name: Separate unchanged104 mechanics and fallback corpus
        env:
          PACKAGE_SHA: ${{ needs.build.outputs.package_sha256 }}
        run: python -B controller/engine/benchmarks/p7f_coverage/coverage_run.py broad --workspace "$GITHUB_WORKSPACE" --package-sha "$PACKAGE_SHA"
      - name: Preserve full records and raw test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p7f-accuracy-broad-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7f-broad-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
  aggregate:
    if: always()
    needs: [build, full500, broad]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: engine-p7f-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7f-build
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: engine-p7f-accuracy-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded
          merge-multiple: false
      - name: Fail unless all500 and broad104 gates are complete
        env:
          PACKAGE_SHA: ${{ needs.build.outputs.package_sha256 }}
        run: python -B controller/engine/benchmarks/p7f_coverage/coverage_run.py aggregate --workspace "$GITHUB_WORKSPACE" --package-sha "$PACKAGE_SHA"
      - name: Preserve explicit aggregate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-p7f-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7f-aggregate-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
